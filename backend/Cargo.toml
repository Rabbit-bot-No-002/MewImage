[package]
name = "mew-image-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.89"
aws-config = { version = "1.11.0", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
# 避免启用 legacy `rustls` 客户端及其已无修复版本的 h2 0.3 依赖链。
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
axum = { version = "0.8.9", features = ["multipart"] }
base64.workspace = true
bytes = "1.10.1"
chrono.workspace = true
futures-util = "0.3.31"
http = "1.3.1"
hyper = { version = "1.7.0", features = ["full"] }
image = { version = "0.25.8", default-features = false, features = ["webp"] }
ipnet = "2.11.0"
mew-image-shared = { path = "../shared" }
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "sync", "time"] }
tower = "0.5.2"
tower-cookies = "0.11.0"
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid.workspace = true
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.177"
