services:
  app:
    image: ${MEW_DOCKER_IMAGE}
    container_name: ${MEW_CONTAINER_NAME}
    restart: unless-stopped
    init: true
    ports:
      # 默认只暴露给本机反向代理；直连部署可显式改为 0.0.0.0。
      - "${MEW_HOST_BIND:-127.0.0.1}:${MEW_HOST_PORT}:3000"
    env_file:
      # 应用配置统一从同目录 .env 注入，Compose 文件无需修改。
      - .env
    environment:
      # 这四项是镜像内部固定路径
      MEW_LISTEN: 0.0.0.0:3000
      MEW_DATABASE_URL: sqlite:///data/mew-image.db
      MEW_FRONTEND_DIST: /app/frontend/dist-app
      MEW_LOCAL_ASSET_DIR: /data/assets
    volumes:
      - ./data:/data:rw
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${MEW_MEMORY_LIMIT}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s
